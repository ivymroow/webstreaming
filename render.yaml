services:
  - type: web
    name: webstreaming-render
    env: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: TMDB_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: MAX_ACTIVE_STREAMS
        value: 8
      - key: STREAM_IDLE_MS
        value: 600000
      - key: DOWNLOAD_TIMEOUT_MS
        value: 480000
      - key: DOWNLOAD_RETENTION_MS
        value: 900000
      - key: FFMPEG_TIMEOUT_MS
        value: 30000
