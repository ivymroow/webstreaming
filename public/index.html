<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>webstreaming</title>
<meta property="og:title" content="webstreaming - #1 free streaming site">
<meta property="og:description" content="no ads besides embeds! super quick! recommended to use without adblocker for best experience. some shows may be glitched with some providers - just try another source. thank you for using webstreaming :3">
<meta property="og:image" content="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='12' fill='%236c5ce7'/%3E%3Ctext x='50' y='70' text-anchor='middle' font-family='monospace' font-weight='900' font-size='44' fill='%23000'%3EWS%3C/text%3E%3C/svg%3E">
<meta property="og:type" content="website">
<meta property="og:url" content="https://web-streaming.site">
<meta name="theme-color" content="#6c5ce7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/variables.css?v=3">
<link rel="stylesheet" href="assets/css/layout.css?v=3">
<link rel="stylesheet" href="assets/css/components.css?v=3">
<link rel="stylesheet" href="assets/css/player.css?v=3">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='12' fill='%236c5ce7'/%3E%3Ctext x='50' y='70' text-anchor='middle' font-family='monospace' font-weight='900' font-size='44' fill='%23000'%3EWS%3C/text%3E%3C/svg%3E">
</head>
<body>
  <div id="app">
    <header id="mainHeader">
      <div class="header-left">
        <a href="#" class="logo" onclick="navigate('home');return false">webstreaming</a>
      </div>
      <div class="header-center">
        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
          <input type="text" id="searchInput" placeholder="Search movies and shows..." autocomplete="off" name="search-query">
        </div>
      </div>
      <div class="header-right">
        <div id="userSection"></div>
      </div>
    </header>

    <main id="main">
      <div class="loading-screen" id="loadingScreen">
        <div class="spinner"></div>
        <p>Loading...</p>
      </div>
    </main>

    <div id="auth-modal" class="modal" style="display:none">
      <div class="modal-backdrop" onclick="hideAuth()"></div>
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="authModalTitle">Sign In</h2>
          <button class="btn-icon" onclick="hideAuth()">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <div class="modal-body">
          <label>Username</label>
          <input type="text" id="authUsername" class="modal-input" placeholder="Your username" autocomplete="off" name="auth-user">
          <div id="authEmailWrap" style="display:none">
            <label>Email</label>
            <input type="email" id="authEmail" class="modal-input" placeholder="you@example.com" autocomplete="email" name="auth-email">
          </div>
          <label>Password</label>
          <input type="password" id="authPassword" class="modal-input" placeholder="Password" autocomplete="new-password" name="auth-pass">
          <div id="auth2faWrap" style="display:none;margin-top:8px">
            <label id="auth2faLabel">2FA Code</label>
            <input type="text" id="auth2fa" class="modal-input" placeholder="000000" autocomplete="one-time-code">
          </div>
          <p style="color:#f87171;font-size:13px" id="authError"></p>
          <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:12px" onclick="doAuth()">continue</button>
          <div id="signedOutReset" style="margin-top:16px;border-top:1px solid var(--border);padding-top:14px">
            <label>Locked out?</label>
            <input type="email" id="signedOutResetEmail" class="modal-input" placeholder="email for password reset" autocomplete="email">
            <p style="color:#f87171;font-size:13px" id="signedOutResetError"></p>
            <p style="color:#4ade80;font-size:13px" id="signedOutResetStatus"></p>
            <button class="btn btn-secondary" style="width:100%;justify-content:center;margin-top:8px" onclick="sendSignedOutPasswordReset()">send reset email</button>
          </div>
          <p style="text-align:center;margin-top:12px;font-size:13px;color:var(--text-muted)" id="authToggle">don't have an account? <a href="#" onclick="toggleAuthMode();return false" style="color:var(--primary)">sign up</a></p>
        </div>
      </div>
    </div>

    <div id="account-modal" class="modal" style="display:none">
      <div class="modal-backdrop" onclick="hideAccountSettings()"></div>
      <div class="modal-content">
        <div class="modal-header">
          <h2>account settings</h2>
          <button class="btn-icon" onclick="hideAccountSettings()">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <div class="modal-body">
          <label>Email</label>
          <input type="email" id="accountEmail" class="modal-input" placeholder="you@example.com" autocomplete="email">
          <p style="color:#f87171;font-size:13px" id="accountError"></p>
          <p style="color:#4ade80;font-size:13px" id="accountStatus"></p>
          <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:12px" onclick="saveAccountEmail()">save email</button>
          <button class="btn btn-secondary" style="width:100%;justify-content:center;margin-top:10px" onclick="sendPasswordReset()">send password reset email</button>
          <div style="margin-top:18px;border-top:1px solid var(--border);padding-top:14px" id="account2faSection">
            <label>Two-Factor Authentication</label>
            <p class="hint" style="color:var(--text-muted)" id="account2faStatus">Loading 2FA status...</p>
            <div id="setup2faBox" style="display:none;background:var(--surface);padding:12px;border-radius:var(--radius);margin-top:8px;text-align:center">
              <p style="font-size:13px;margin-bottom:8px">Scan with authenticator app:</p>
              <img id="setup2faQr" src="" style="width:150px;height:150px;display:inline-block;background:#fff;border-radius:4px" />
              <input type="text" id="setup2faCode" class="modal-input" placeholder="Enter 6-digit code" style="margin-top:8px">
              <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:8px" onclick="verify2fa()">verify and enable</button>
              <button class="btn btn-secondary" style="width:100%;justify-content:center;margin-top:6px" onclick="cancel2faSetup()">cancel</button>
            </div>
            <div id="disable2faBox" style="display:none;margin-top:8px">
              <button class="btn btn-secondary" style="width:100%;justify-content:center;color:#f87171" onclick="disable2fa()">disable authenticator 2fa</button>
            </div>
            <div id="setupEmail2faBox" style="display:none;margin-top:8px;background:var(--surface);padding:12px;border-radius:var(--radius)">
              <p style="font-size:13px;color:var(--text-muted);margin-bottom:8px">A 6-digit code will be emailed each time you sign in.</p>
              <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:4px" onclick="enableEmail2fa()">enable email 2fa</button>
              <button class="btn btn-secondary" style="width:100%;justify-content:center;margin-top:6px" onclick="cancel2faSetup()">cancel</button>
            </div>
            <div id="disableEmail2faBox" style="display:none;margin-top:8px">
              <button class="btn btn-secondary" style="width:100%;justify-content:center;color:#f87171" onclick="disableEmail2fa()">disable email 2fa</button>
            </div>
            <div id="no2faActions" style="display:flex;gap:8px;margin-top:8px">
              <button class="btn btn-secondary" id="btnSetup2fa" style="flex:1;justify-content:center;font-size:12px" onclick="start2faSetup()">Authenticator App</button>
              <button class="btn btn-secondary" id="btnSetupEmail2fa" style="flex:1;justify-content:center;font-size:12px" onclick="startEmail2faSetup()">Email Code</button>
            </div>
          </div>
          <div style="margin-top:18px;border-top:1px solid var(--border);padding-top:14px">
            <label>Delete account</label>
            <p class="hint" style="color:var(--text-muted)">This permanently deletes your account, watchlist, and watch history.</p>
            <input type="text" id="deleteAccountConfirm" class="modal-input" placeholder="type DELETE MY ACCOUNT">
            <button class="btn btn-secondary" style="width:100%;justify-content:center;margin-top:8px;color:#f87171;border-color:#7f1d1d" onclick="deleteMyAccount()">delete all account data</button>
          </div>
        </div>
      </div>
    </div>

    <div id="reset-modal" class="modal" style="display:none">
      <div class="modal-backdrop"></div>
      <div class="modal-content">
        <div class="modal-header">
          <h2>reset password</h2>
        </div>
        <div class="modal-body">
          <label>New password</label>
          <input type="password" id="resetPassword" class="modal-input" placeholder="New password" autocomplete="new-password">
          <label>Confirm password</label>
          <input type="password" id="resetPasswordConfirm" class="modal-input" placeholder="Confirm password" autocomplete="new-password">
          <p style="color:#f87171;font-size:13px" id="resetError"></p>
          <p style="color:#4ade80;font-size:13px" id="resetStatus"></p>
          <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:12px" onclick="submitPasswordReset()">save new password</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js?v=27"></script>
</body>
</html>
